[project]
name = "testflow-server"
version = "0.1.0"
description = "TestFlow modular monolith"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "websockets>=14,<17",
  "jsonschema>=4.23,<5",
  "python-multipart>=0.0.20,<1",
  "cryptography>=45,<48",
  "argon2-cffi>=25,<26",
  "kubernetes-asyncio>=33,<37",
  "pillow>=12,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "aiosqlite>=0.21,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

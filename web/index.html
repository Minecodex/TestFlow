<!doctype html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#347354" />
    <title>TestFlow</title>
    <script>
      try {
        document.documentElement.className = localStorage.getItem('testflow.theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.lang = localStorage.getItem('testflow.locale') === 'en-US' ? 'en-US' : 'zh-CN';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 100m;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/ {
        proxy_pass http://testflow-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
        error_page 502 503 504 =503 @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"service_unavailable","message":"Service temporarily unavailable; retry this request","fields":{},"request_id":"$request_id"}';
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

pageRenderers.modules=()=>head('能力模块','导入语言无关的模块，配置契约与参数，统一由 Kubernetes Pod 启动。',btn(icon('upload')+'导入 ZIP 模块','import-module','primary'),'CAPABILITIES / 03')+'<div class="toolbar"><div class="row wrap">'+badge(state.modules.filter(m=>!m.hidden).length+' 个可用模块','green')+'<span class="small muted">命名输入输出 · 动态配置 · 语言无关适配</span></div><button class="link-button small" data-a="module-spec">'+icon('code')+' 包结构说明</button></div>'+notice('平台按模块契约调用，通过 HTTP 管理执行、WebSocket 传递流式数据；模块内部实现由模块代码负责。')+'<div class="grid grid3 mt">'+state.modules.filter(m=>!m.hidden).map(m=>'<article class="module-card"><div class="row between"><div class="row"><span class="module-icon">'+icon(m.icon)+'</span><div><h3>'+esc(m.name)+'</h3><span class="tiny muted mono">'+esc(m.id)+' / '+esc(m.version)+'</span></div></div>'+badge(m.sequential?'案例顺序':'可并发',m.sequential?'amber':'green')+'</div><div class="row wrap" style="gap:5px;margin-top:12px">'+badge(launchLabels[m.runtime.launch],'green')+'</div><p class="small muted" style="margin-top:13px;min-height:36px">'+esc(m.description)+'</p><div class="module-contract-groups"><div><div class="eyebrow mb">输入字段组</div>'+chips(m.input)+'</div><div><div class="eyebrow mb">输出字段组</div>'+chips(m.output)+'</div></div><div class="module-footer"><span class="tiny muted">'+icon('code')+' 标准模块契约</span><span class="tiny '+(m.trace?'text-green':'muted')+'">'+(m.trace?'适配内部 Trace':'仅节点边界')+'</span></div><div class="row between mt"><span class="tag">'+esc(m.ui.split('/').pop())+'</span>'+btn('编辑','edit-module-runtime','sm','data-id="'+m.id+'"')+btn('查看契约 '+icon('arrow'),'module-detail','sm ghost','data-id="'+m.id+'"')+'</div></article>').join('')+'</div><div class="section-note">镜像和仓库挂载均为演示声明；此 HTML 不执行 ZIP、不启动Pod、不调用真实模块。</div>';

function flowEdgesUI(f){return '<div class="inspector-section"><h3>整组连线</h3>'+(f.edges.length?f.edges.map(([from,to],i)=>'<div class="row between small mb"><span>'+esc(f.nodes.find(n=>n.id===from)?.name)+' → '+esc(f.nodes.find(n=>n.id===to)?.name)+'</span>'+btn(icon('trash')+'删除','remove-edge','sm ghost','data-index="'+i+'" aria-label="删除连线 '+(i+1)+'"')+'</div>').join(''):notice('尚未连接完整来源组。'))+'</div>';}
function inspectorHTML(f){const n=f.nodes.find(n=>n.id===state.view.nodeId);if(!n)return '';const m=state.modules.find(m=>m.id===n.moduleId);return field('节点名称',input('node-name',n.name,'data-node-name'))+field('节点描述','<textarea data-node-description rows="3">'+esc(n.description||'')+'</textarea>')+'<div class="inspector-section"><h3>'+esc(n.kind==='module'?'能力参数':'节点参数')+'</h3>'+(n.kind==='module'?paramsUI(n):n.kind==='start'?btn('编辑开始输入','flow-schema','sm','data-id="'+f.id+'" data-kind="start"'):n.kind==='end'?btn('编辑统一输出','flow-schema','sm','data-id="'+f.id+'" data-kind="end"'):n.kind==='conversion'?field('转换方向',select('conversion-direction',[{id:'to-stream',name:'完整值 → 流式'},{id:'to-batch',name:'流式 → 完整值'}],n.params.direction||'to-stream','data-conversion-direction')):assemblyUI(n,f))+'</div>'; }
function assemblyUI(n,f){const available=f.edges.filter(e=>e[1]===n.id).flatMap(e=>{const source=f.nodes.find(s=>s.id===e[0]);return source?.output.map(field=>({id:source.id+':'+field.name,name:source.name+'.'+field.name}))||[];});return'<div class="small muted mb">等待所需静态值和可读取的流，按明确映射组装。未选字段不继续派发。</div>'+n.output.map(target=>{const mapping=n.mappings.find(m=>m.target===target.name);return field('<code>'+esc(target.name)+'</code> ← 来源字段',select('map-'+target.name,[{id:'',name:'选择已连接来源字段'},...available],mapping?mapping.source+':'+mapping.field:'','data-node-mapping="'+esc(target.name)+'"'));}).join('')+btn('编辑目标输出组','assembly-schema','sm','data-id="'+n.id+'"');}

function nodeLibraryHTML(){return '<aside class="palette canvas-library"><div class="row between"><h3>模块与内置节点</h3>'+btn(icon('x'),'toggle-node-library','sm ghost','aria-label="关闭节点库"')+'</div>'+field('搜索模块',input('node-library-query',state.view.moduleSearch||''))+'<div class="palette-label">已导入模块</div>'+state.modules.filter(m=>!m.hidden&&m.name.toLowerCase().includes((state.view.moduleSearch||'').toLowerCase())).map(m=>'<button class="palette-item" data-a="add-node" data-module="'+m.id+'">'+icon(m.icon)+'<span>'+esc(m.name)+'</span></button>').join('')+'<div class="palette-label">内置节点</div>'+[{kind:'assembly',name:'字段组装 / 选择',icon:'merge'},{kind:'conversion',name:'流式转换',icon:'refresh'},{kind:'end',name:'结束节点',icon:'stop'}].map(n=>'<button class="palette-item" data-a="add-node" data-kind="'+n.kind+'">'+icon(n.icon)+'<span>'+n.name+'</span></button>').join('')+'</aside>';}
function edgesHTML(f){return '<defs><marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#a6bda0" stroke-width="1.2"/></marker></defs>'+f.edges.map((e,i)=>{const a=f.nodes.find(n=>n.id===e[0]),b=f.nodes.find(n=>n.id===e[1]);if(!a||!b)return '';const ah=$('[data-node="'+a.id+'"]')?.offsetHeight||145,bh=$('[data-node="'+b.id+'"]')?.offsetHeight||145,x1=a.x+180,y1=a.y+ah/2,x2=b.x,y2=b.y+bh/2,dx=Math.max(14,Math.abs(x2-x1)*.45),x=(x1+x2)/2,y=(y1+y2)/2;return '<g class="prototype-edge"><path class="edge" d="M '+x1+' '+y1+' C '+(x1+dx)+' '+y1+', '+(x2-dx)+' '+y2+', '+x2+' '+y2+'" marker-end="url(#arrowhead)"/><foreignObject x="'+(x-14)+'" y="'+(y-14)+'" width="28" height="28" class="prototype-edge-delete">'+btn(icon('trash'),'remove-edge','sm','data-index="'+i+'" aria-label="删除连线"')+'</foreignObject></g>';}).join('');}
function updateEdges(){if($('#edges'))$('#edges').innerHTML=edgesHTML(selectedFlow());}
function transformCanvas(){const surface=$('#canvas-surface');if(!surface)return;surface.style.setProperty('--scale',state.view.zoom);surface.style.transform='translate('+(state.view.panX||0)+'px,'+(state.view.panY||0)+'px) scale('+state.view.zoom+')';$('#zoom-label').textContent=Math.round(state.view.zoom*100)+'%';updateEdges();}
function fitCanvas(){const canvas=$('#canvas');if(!canvas)return;const f=selectedFlow(),minX=Math.min(...f.nodes.map(n=>n.x),0),maxX=Math.max(...f.nodes.map(n=>n.x+180),700),maxY=Math.max(...f.nodes.map(n=>n.y+170),500);state.view.zoom=Math.min(1,(canvas.clientWidth-36)/(maxX-minX+35),(canvas.clientHeight-68)/(maxY+35));state.view.panX=(canvas.clientWidth-(maxX-minX)*state.view.zoom)/2-minX*state.view.zoom;state.view.panY=(canvas.clientHeight-maxY*state.view.zoom)/2+10;transformCanvas();}
function setupCanvas(){const canvas=$('#canvas');updateEdges();if(!state.view.keepZoom)fitCanvas();else transformCanvas();state.view.keepZoom=true;graphObserver=new ResizeObserver(()=>fitCanvas());graphObserver.observe(canvas);let drag=null;canvas.addEventListener('pointerdown',e=>{if(e.target.closest('button,.palette,input,select,textarea')||e.target.closest('[data-edge]'))return;const nodeEl=e.target.closest('[data-node]'),n=nodeEl?selectedFlow().nodes.find(n=>n.id===nodeEl.dataset.node):null;drag={node:n,el:nodeEl,x:e.clientX,y:e.clientY,ox:n?n.x:state.view.panX,oy:n?n.y:state.view.panY,moved:false};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;if(drag.node&&drag.moved){drag.node.x=Math.max(0,Math.min(1080,drag.ox+dx/state.view.zoom));drag.node.y=Math.max(30,Math.min(600,drag.oy+dy/state.view.zoom));drag.el.style.left=drag.node.x+'px';drag.el.style.top=drag.node.y+'px';updateEdges();markFlowDirty();}else{state.view.panX=drag.ox+dx;state.view.panY=drag.oy+dy;transformCanvas();}});canvas.addEventListener('pointerup',()=>{if(drag?.node&&!drag.moved)selectNode(drag.node.id);else if(drag&&!drag.node&&!drag.moved){selectNode(null);}drag=null;});canvas.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.node){e.preventDefault();selectNode(e.target.dataset.node);}});}
function selectNode(nid){state.view.nodeId=nid;$$('.flow-node').forEach(el=>el.classList.toggle('selected',el.dataset.node===nid));openDrawer(esc(selectedFlow().nodes.find(n=>n.id===nid)?.name||'节点配置'),'<div id="inspector">'+inspectorHTML(selectedFlow())+'</div>',btn('关闭','close-drawer'));}
function markFlowDirty(){selectedFlow().dirty=true;const revert=$('[data-a="revert-flow"]');if(revert&&selectedFlow().saved){revert.hidden=false;revert.disabled=false;}const v=$('.pipeline-bar .badge:last-child');if(v){v.textContent='未保存修改';v.className='badge amber';}}
function updateNodeRuntime(el){const f=selectedFlow(),n=f.nodes.find(n=>n.id===state.view.nodeId);if(!n?.runtime)return;const oldRepo=runtimeRepositoryId(n.runtime);setRuntimeField(n.runtime,el.dataset.nodeRuntime,el.value.trim());if(runtimeRepositoryId(n.runtime)!==oldRepo)n.commitBinding=state.repos.find(r=>r.id===runtimeRepositoryId(n.runtime))?.commit||null;markFlowDirty();if(el.tagName==='SELECT')if($('#inspector'))$('#inspector').innerHTML=inspectorHTML(f);}

function taskDetail(t){const report=t.reportHistory?.find(r=>r.id===state.view.reportId),list=report?report.executions:t.plan.map(p=>latestAttempt(t,p,true)).filter(Boolean),c=report?executionCounts(list,t.plan.length,t.profile):taskCounts(t),ref=rates(list,'reference',t.profile),quality=rates(list,'quality',t.profile);return head(esc(t.name),'批次 '+t.id+' · 统一评测配置 '+t.profile.name+' v'+t.profile.version,btn('返回任务列表','task-back')+(t.status==='running'?btn(icon('stop')+'取消整个任务','cancel-task','danger','data-id="'+t.id+'"'):btn(icon('plus')+'创建新任务','new-task','primary')),'TASK / REPORT')+'<div class="grid grid4 mb">'+stat('执行进度',c.done+'<span style="font-size:15px"> / '+t.plan.length+'</span>',c.waiting+' 待执行 · '+c.running+' 运行中','task')+stat('执行成功 / 失败',c.success+'<span style="font-size:16px"> / '+c.failed+'</span>','流程执行结果，与内容评分独立','flow')+stat('参考维度通过率',ref.pass==null?'—':ref.pass+'%',ref.passed+' 通过 / '+ref.valid+' 有效判定','judge')+stat('参考维度覆盖率',ref.coverage==null?'—':ref.coverage+'%',ref.valid+' 有效 / '+ref.total+' 应评项','database')+'</div><section class="panel mb"><div class="panel-head"><h2>配对计划与执行约束</h2><div class="row">'+select('report-record',[{id:'current',name:'当前报告'},...(t.reportHistory||[]).map(r=>({id:r.id,name:r.name+' · '+fmtTime(r.created)}))],report?.id||'current')+statusBadge(report?.status||t.status)+'</div></div><div class="panel-body"><div class="row wrap mb">'+badge('所设案例并发 '+t.requestedConcurrency,'blue')+badge('有效案例并发 '+t.effectiveConcurrency,'green')+badge('仅所选配对')+'<span class="small muted">'+(t.sequentialSources.length?'顺序限制来源：'+esc(t.sequentialSources.join('、')):'模块未声明顺序限制；图内独立分支可并行。')+'</span></div>'+table(['测试集快照','流程快照','计划数','已执行','未执行','运行中'],t.pairs.map(pair=>{const plans=t.plan.filter(p=>p.pairId===pair.id),executions=plans.map(p=>list.find(e=>e.planId===p.id)).filter(Boolean),active=report?[]:plans.map(p=>latestAttempt(t,p)).filter(e=>e?.status==='running');return'<tr><td><span class="cell-title">'+esc(pair.dataset.name)+'</span> '+badge('v'+pair.dataset.version)+'</td><td><span class="cell-title">'+esc(pair.flow.name)+'</span> '+badge('v'+pair.flow.version)+'</td><td class="mono">'+plans.length+'</td><td class="mono">'+executions.filter(e=>e.status!=='running').length+'</td><td class="mono">'+plans.filter(p=>!list.some(e=>e.planId===p.id)&&!active.some(e=>e.planId===p.id)).length+'</td><td class="mono">'+active.length+'</td></tr>';}))+'</div></section><section class="panel"><div class="panel-head"><h2>案例执行列表</h2><div class="row"><span class="small muted">无参考质量通过率 '+(quality.pass??'—')+(quality.pass==null?'':'%')+'</span>'+btn('全局执行历史 '+icon('arrow'),'task-history','sm ghost','data-id="'+t.id+'"')+'</div></div>'+table(['案例 / 执行尝试','输入材料','最终输出','配对流程','执行','判定','收尾','耗时',''],t.plan.map(plan=>{const active=report?null:latestAttempt(t,plan),ex=report?list.find(e=>e.planId===plan.id):latestAttempt(t,plan,true)||active;return'<tr><td><div class="cell-title">'+esc(plan.case.name)+'</div><div class="cell-sub mono">'+(ex?ex.id+' · 第 '+ex.attempt+' 次尝试'+(active?.status==='running'&&active.id!==ex.id?' · 新尝试运行中，保留已结束结果':''):'尚未创建执行')+'</div></td><td>'+inputSummary(plan.case,ex?.inputSnapshot)+'</td><td>'+(ex?outputSummary(ex):'—')+'</td><td class="small muted">'+esc(plan.flow.name)+'</td><td>'+(ex?statusBadge(ex.status):t.status==='canceled'?badge('未执行 · 任务取消','amber'):statusBadge('pending'))+'</td><td>'+(ex?statusBadge(verdict(ex,t.profile)):'—')+'</td><td>'+(ex?statusBadge(ex.cleanup):'—')+'</td><td class="mono muted">'+(ex?fmtMs(ex.duration):'—')+'</td><td class="table-actions">'+(ex?btn('查看 Trace '+icon('arrow'),'execution-detail','sm ghost','data-id="'+ex.id+'"')+(active?.status==='running'&&active.id!==ex.id?btn('查看新尝试','execution-detail','sm','data-id="'+active.id+'"'):''):'')+'</td></tr>';}))+'</section><div class="mt">'+notice('单案例失败保留错误并继续计划。用户取消任务才停止全部计划。旧执行、评分与报告保留，重跑不改变计划分母。新尝试运行时保留已结束结果并单列进度；本报告按批次固定的评测配置版本统计，其他口径的复评可在执行详情查看。')+'</div>';}

function deps(n){return n.kind==='assembly'?Array.from(new Set(n.mappings.map(m=>m.source))):f.edges.filter(e=>e[1]===n.id).map(e=>e[0]);}

function launchTask(t){t.status='running';let next=0,active=0;function schedule(){if(t.status==='canceled')return;while(active<t.effectiveConcurrency&&next<t.plan.length){const plan=t.plan[next++],ex=makeExecution(t,plan);active++;runExecution(ex,t.injectFailure&&next===3).finally(()=>{active--;if(t.status==='canceled'){if(active===0)reportSnapshot(t);refreshLive();return;}if(next>=t.plan.length&&active===0){t.status=taskResultStatus(t);reportSnapshot(t);}else schedule();refreshLive();});}refreshLive();}schedule();}

function wavBlob(samples,rate=16000){const buffer=new ArrayBuffer(44+samples.length*2),v=new DataView(buffer),write=(i,s)=>{for(let j=0;j<s.length;j++)v.setUint8(i+j,s.charCodeAt(j));};write(0,'RIFF');v.setUint32(4,36+samples.length*2,true);write(8,'WAVE');write(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);write(36,'data');v.setUint32(40,samples.length*2,true);for(let i=0;i<samples.length;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,samples[i]))*32767,true);return new Blob([buffer],{type:'audio/wav'});}
async function audioToWav(blob){const ctx=new (window.AudioContext||window.webkitAudioContext)();try{const decoded=await ctx.decodeAudioData(await blob.arrayBuffer());const offline=new OfflineAudioContext(1,Math.ceil(decoded.duration*16000),16000),source=offline.createBufferSource();source.buffer=decoded;source.connect(offline.destination);source.start();const result=await offline.startRendering();return{blob:wavBlob(result.getChannelData(0)),duration:decoded.duration};}finally{await ctx.close();}}

actions['start-record']=async el=>{const target=el.dataset.target||'modal';if(recordingBusy||recorder?.state==='recording')return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('当前浏览器不支持录音，请使用本地音频导入',true);return;}recordingTarget=target;recordingBusy=true;const origin=$('#modal-layer .modal');el.disabled=true;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(recordingTarget!==target||$('#modal-layer').hidden){stream.getTracks().forEach(t=>t.stop());recordingBusy=false;return;}micStream=stream;const chunks=[];recorder=new MediaRecorder(stream);const ownRecorder=recorder;const started=Date.now();recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());micStream=null;recordingTarget=null;try{if(!chunks.length)throw new Error('没有可用录音数据');const converted=await audioToWav(new Blob(chunks,{type:ownRecorder.mimeType}));const a={id:id('recording'),name:'实时录音_'+new Date(started).toTimeString().slice(0,8).replace(/:/g,'')+'.wav',type:'Audio',format:'WAV · 16kHz · Mono',url:URL.createObjectURL(converted.blob),duration:converted.duration,transcript:'',reference:'',confirmed:false,category:'待分类',tags:['实时录音'],hidden:false};state.assets.push(a);if(target==='quick'&&$('#modal-layer .modal')===origin&&!$('#modal-layer').hidden){const q=$('[data-quick-audio]');if(q){q.insertAdjacentHTML('beforeend',option(a.id,a.name,a.id));q.value=a.id;}}if($('#modal-layer .modal')===origin&&$('#record-status')){$('#record-status').className='';}if($('#modal-layer .modal')===origin&&$('#record-status'))$('#record-status').textContent='录音已入池 · '+converted.duration.toFixed(1)+'s';if($('#modal-layer .modal')===origin&&$('#start-record-button'))$('#start-record-button').disabled=false;if($('#modal-layer .modal')===origin&&$('#stop-record-button'))$('#stop-record-button').disabled=true;toast('真实录音已自动入池，参考待确认');if(state.route==='assets'&&$('#modal-layer').hidden)render();}catch(error){toast('录音转换失败：'+error.message,true);if($('#modal-layer .modal')===origin&&$('#start-record-button'))$('#start-record-button').disabled=false;}finally{recordingBusy=false;}};recorder.start(200);if($('#record-status')){$('#record-status').textContent='正在录音';$('#record-status').className='recording-light';}if($('#stop-record-button'))$('#stop-record-button').disabled=false;toast('麦克风已开启');}catch(error){recordingTarget=null;recordingBusy=false;micStream?.getTracks().forEach(t=>t.stop());micStream=null;el.disabled=false;toast('无法使用麦克风：'+error.message+'。可从素材池导入本地音频。',true);}};

function buildTask(name,pairs,profile,concurrency,repeats=1,injectFailure=false){if(!name?.trim()||!pairs.length||!profile||!Number.isInteger(concurrency)||concurrency<1||!Number.isInteger(repeats)||repeats<1||repeats>5)throw new Error('任务名称、配对和评测配置必填；并发应为正整数，重复次数为 1–5。');const resolved=pairs.map(pair=>{const ds=state.datasets.find(d=>d.id===pair.datasetId),f=state.flows.find(f=>f.id===pair.flowId);if(!ds||!f||ds.hidden||f.hidden)throw new Error('选择可用测试集和流程。');if(f.dirty)throw new Error('请先保存流程“'+f.name+'”的版本。');const errors=pairErrors(ds,f);if(errors.length)throw new Error(errors[0]);return{id:id('pair'),datasetId:ds.id,flowId:f.id,dataset:clone(ds),flow:flowSnapshot(f)};});const sources=Array.from(new Set(resolved.flatMap(p=>sequentialSource(p.flow)))),t={id:id('batch'),name,status:'running',created:Date.now(),requestedConcurrency:concurrency,effectiveConcurrency:sources.length?1:concurrency,sequentialSources:sources,profile:clone(profile),pairs:resolved,plan:[],attemptIds:[],injectFailure,reportHistory:[]};resolved.forEach(pair=>{const unique=Array.from(new Map(pair.dataset.cases.map(c=>[c.id,c])).values());for(let repetition=0;repetition<repeats;repetition++)unique.forEach(c=>t.plan.push({id:id('plan'),pairId:pair.id,case:clone(c),inputSnapshot:resolveInputs(c),dataset:pair.dataset,flow:pair.flow,repetition:repetition+1}));});if(!t.plan.length)throw new Error('测试计划没有完整案例。');if(t.plan.length>200)throw new Error('单次浏览器演示最多运行 200 个计划项，请减少配对或重复次数。');return t;}
forms['task-form']=()=>{captureTaskForm();if(!taskDraft.name.trim()||!Number.isInteger(taskDraft.concurrency)||taskDraft.concurrency<1||!Number.isInteger(taskDraft.repeats)||taskDraft.repeats<1)throw new Error('填写任务名称；案例并发和重复次数应为正整数。');const t=buildTask(taskDraft.name.trim(),taskDraft.pairs,state.profiles.find(p=>p.id===taskDraft.profileId),taskDraft.concurrency,taskDraft.repeats,taskDraft.injectFailure);state.tasks.push(t);closeModal();navigate('tasks',{taskId:t.id,reportId:null});launchTask(t);toast('计划已冻结，共 '+t.plan.length+' 个独立计划项');};

forms['quick-form']=form=>{const data=new FormData(form),f=selectedFlow();if(recordingBusy||recorder?.state==='recording')throw new Error('先完成录音与格式转换，再提交本次输入。');let ds,c;if(data.get('source')==='dataset'){ds=state.datasets.find(d=>d.id===data.get('dataset'));c=ds?.cases.find(c=>c.id===data.get('case'));if(!c)throw new Error('选择完整测试集案例。');const errors=pairErrors(ds,f);if(errors.length)throw new Error(errors[0]);}else{const inputs={};f.inputSchema.forEach(field=>{const value=String(data.get('quick-'+field.name)||'').trim();if(!value)throw new Error(field.name+' 缺少必需输入。');inputs[field.name]=field.type==='Text'?{value}:value;});c={id:id('live_case'),name:'实时 / 自定义快速测试',inputs,reference:'',confirmed:false,index:0};ds={id:'quick-input',name:'实时 / 自定义输入',version:1,inputSchema:clone(f.inputSchema),outputSchema:clone(f.outputSchema),cases:[c]};}const snapshot=flowSnapshot(f),pid=id('pair'),sources=sequentialSource(snapshot),t={id:id('batch'),name:'快速测试 · '+f.name,status:'running',created:Date.now(),requestedConcurrency:1,effectiveConcurrency:1,sequentialSources:sources,profile:clone(state.profiles.find(p=>p.id===data.get('profile'))),pairs:[{id:pid,datasetId:ds.id,flowId:f.id,dataset:clone(ds),flow:snapshot}],plan:[{id:id('plan'),pairId:pid,case:clone(c),inputSnapshot:resolveInputs(c),dataset:clone(ds),flow:snapshot}],attemptIds:[],injectFailure:false,reportHistory:[]};state.tasks.push(t);closeModal();navigate('tasks',{taskId:t.id,reportId:null});launchTask(t);};

document.addEventListener('change',event=>{const el=event.target;if(el.name?.startsWith('module-')&&$('#module-form')&&el.tagName==='SELECT'){captureModuleForm();const map={'module-reuse':'pod.reuseScope'};if(map[el.name])setRuntimeField(moduleDraft.runtime,map[el.name],el.value);showModuleForm();return;}if(el.dataset.nodeRuntime!==undefined){updateNodeRuntime(el);return;}if(el.name==='metrics-profile'){state.view.metricsProfile=el.value;render();return;}const filters={'asset-type':'assetType','history-status':'historyStatus','history-attempts':'historyAttempts','history-dataset':'historyDataset','history-flow':'historyFlow','history-task':'historyTask'};if(filters[el.name]){state.view[filters[el.name]]=el.value;render();return;}if(el.name==='flow-select'){navigate('pipelines',{flowId:el.value,nodeId:null,keepZoom:false});return;}if(el.name==='eval-record'){state.view.evalId=el.value;render();return;}if(el.name==='report-record'){state.view.reportId=el.value==='current'?null:el.value;render();return;}if(el.dataset.fieldType!==undefined){const row=el.closest('.schema-row');$('[data-field-format]',row).value=F('',el.value).format;return;}if(el.dataset.nodeParam!==undefined){const n=selectedFlow().nodes.find(n=>n.id===state.view.nodeId);n.params[el.dataset.nodeParam]=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value;markFlowDirty();return;}if(el.dataset.nodeTimeout!==undefined){selectedFlow().nodes.find(n=>n.id===state.view.nodeId).timeout=Number(el.value);markFlowDirty();return;}if(el.dataset.nodeMapping!==undefined){const n=selectedFlow().nodes.find(n=>n.id===state.view.nodeId),i=el.value.indexOf(':'),target=el.dataset.nodeMapping;n.mappings=n.mappings.filter(m=>m.target!==target);if(i>=0)n.mappings.push({target,source:el.value.slice(0,i),field:el.value.slice(i+1)});markFlowDirty();return;}if(el.dataset.conversionDirection!==undefined){const n=selectedFlow().nodes.find(n=>n.id===state.view.nodeId);n.params.direction=el.value;n.output=n.inpu

# Apply separately after configuring your ingress controller, host and TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: testflow
  namespace: testflow-dev
spec:
  ingressClassName: nginx
  rules:
    - host: testflow.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: testflow-web
                port:
                  number: 8080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: testflow-server
  namespace: testflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: testflow-server
  template:
    metadata:
      labels:
        app: testflow-server
    spec:
      serviceAccountName: testflow-server
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: server
        image: kakj/testflow-server:v0.0.1-beta
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: testflow-config
        - secretRef:
            name: testflow-secrets
        env:
        - name: TESTFLOW_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TESTFLOW_BACKEND_NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          timeoutSeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: testflow-data
      - name: tmp
        emptyDir: {}
      - name: bootstrap
        configMap:
          name: testflow-bootstrap-code
      initContainers:
      - name: wait-migration
        image: kakj/testflow-server:v0.0.1-beta
        imagePullPolicy: IfNotPresent
        command:
        - python
        - /bootstrap/bootstrap.py
        - wait-schema
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        envFrom:
        - secretRef:
            name: testflow-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: testflow-server
  namespace: testflow
spec:
  selector:
    app: testflow-server
  ports:
  - name: http
    port: 8000
    targetPort: http

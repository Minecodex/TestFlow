apiVersion: batch/v1
kind: Job
metadata:
  name: testflow-migrate-v0-0-1-beta
  namespace: testflow
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: testflow-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: migrate
        image: kakj/testflow-server:v0.0.1-beta
        command:
        - alembic
        - -c
        - /app/alembic.ini
        - upgrade
        - head
        envFrom:
        - secretRef:
            name: testflow-secrets
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
      initContainers:
      - name: wait-postgres
        image: kakj/testflow-server:v0.0.1-beta
        imagePullPolicy: IfNotPresent
        command:
        - python
        - /bootstrap/bootstrap.py
        - wait-database
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        envFrom:
        - secretRef:
            name: testflow-secrets
      volumes:
      - name: bootstrap
        configMap:
          name: testflow-bootstrap-code

apiVersion: v1
kind: ServiceAccount
metadata:
  name: testflow-server
  namespace: testflow
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: testflow-module
  namespace: testflow
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: testflow-module-pods
  namespace: testflow
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - create
  - get
  - list
  - watch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: testflow-module-pods
  namespace: testflow
subjects:
- kind: ServiceAccount
  name: testflow-server
  namespace: testflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: testflow-module-pods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: testflow-registry-secrets
  namespace: testflow
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
  - get
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: testflow-registry-secrets
  namespace: testflow
subjects:
- kind: ServiceAccount
  name: testflow-server
  namespace: testflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: testflow-registry-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: testflow-bootstrap
  namespace: testflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: testflow-bootstrap
  namespace: testflow
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  resourceNames:
  - testflow-secrets
  - testflow-postgres-secret
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: testflow-bootstrap
  namespace: testflow
subjects:
- kind: ServiceAccount
  name: testflow-bootstrap
  namespace: testflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: testflow-bootstrap
